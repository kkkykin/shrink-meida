# shrink_media_server configuration (YAML)
#
# Usage:
#   cp server.example.yaml server.yaml
#
# Environment variables override YAML values:
#   - SERVER_CONFIG_FILE, SERVER_DB_URL, SERVER_HOST, SERVER_PORT
#   - SERVER_SCAN_ON_STARTUP, SERVER_SCAN_INTERVAL_SECONDS, SERVER_COPY_BATCH_SIZE
#   - OPENLIST_BASE_URL, OPENLIST_USER, OPENLIST_PASS, OPENLIST_OTP
#   - ROUTES_JSON
#   - WORKER_TOKEN_*, WORKER_TOKENS, WORKER_TOKENS_SCOPES_JSON

db_url: sqlite:///shrink_media_server.db

openlist:
  base_url: http://127.0.0.1:15244
  user: admin
  pass: your_password
  otp: null # optional

server:
  host: 127.0.0.1
  port: 8000
  scan_on_startup: true
  scan_interval_seconds: 300 # 0=disable periodic scan by default (routes can override)
  copy_batch_size: 50 # copy-mode 每批提交/落库数量（不是总上限）

bootstrap_tokens:
  # 无 scope：可处理所有 route + 所有 kind（image/video/audio/comic/subtitle/other）
  - dev-token-001
  # 带 scope（可选）：限制该 token 注册出来的 worker 只能 lease 特定任务
  # - token: token-r1-image
  #   base_url: http://10.0.0.10:15244 # 可选：下发给 worker 的 OpenList base_url（内网 worker 可避免走公网）
  #   allow_routes: [photos]   # route id 列表
  #   allow_kinds: [image]     # kind 列表：image/video/audio/comic/subtitle/other

routes:
  - id: photos
    in_root: /photos/raw
    out_root: /photos/compressed
    # Optional per-route scan interval override (seconds).
    # When omitted, falls back to server.scan_interval_seconds.
    # scan_interval_seconds: 60
    # mode: compress|copy (default: compress)
    # - compress: worker 下载/转码/上传，server finalize
    # - copy: server 直接调用 OpenList 远端 copy（不下载/不上传）
    mode: compress

  - id: videos
    in_root: /videos/source
    out_root: /videos/output
    # scan_interval_seconds: 600
    profile:
      video_encoder: libx265
      video_crf: 28
